name: Validación del backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: portfolio_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://portfolio:test_only_password@localhost:55432/portfolio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formato, análisis y pruebas
        run: |
          test -z "$(gofmt -l cmd internal migrations openapi)"
          go vet ./...
          go test -race ./...
          go build ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar infraestructura
        run: |
          pip install cfn-lint==1.47.0
          cfn-lint deploy/aws/*.template.json
      - name: Construir y probar Docker
        run: |
          docker compose build
          docker compose up -d
          trap 'docker compose logs; docker compose down -v' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/ready; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/health
          curl --fail http://localhost:8080/ready
          curl --fail http://localhost:8080/api/v1/portfolio/profile
